<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c111a">
  <meta name="description" content="A private room to deal Werewolf roles to friends. Everyone sees only their own role.">
  <title>Moonlit — Werewolf Roles</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="moon"></div><div class="star s1"></div><div class="star s2"></div><div class="star s3"></div><div class="star s4"></div><div class="star s5"></div></div>
  <main class="shell">
    <header class="masthead">
      <div class="brand-symbol" aria-hidden="true">◐</div>
      <div class="brand-copy"><strong>MOONLIT</strong><span>A WEREWOLF PARTY GAME</span></div>
    </header>
    <div id="app"></div>
    <footer class="footer">One room. One secret role each. 🌙</footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
